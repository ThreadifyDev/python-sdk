name: Publish Python SDK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/sdk.yml
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import ast, os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag and package version differ'
          module = ast.parse(pathlib.Path('threadify/__init__.py').read_text())
          runtime = next(ast.literal_eval(n.value) for n in module.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert runtime == version, 'Runtime and package version differ'
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify installed wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -I -c "import threadify; from importlib.metadata import version; assert threadify.__version__ == version('threadify-sdk'); from threadify import PermissionGrant, WaitResult, ThreadifyError"
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
