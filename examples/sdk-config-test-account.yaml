name: SDK Config Test Account
description: Account-level delivery health, failure patterns, validation quality, and retry pressure.

type:
  - sdk_config_account_id
  - sdk_config_account_ref

metrics:
  - name: Account activity by process
    custom_definition:
      name: Account activity by process
      target: thread
      operation: COUNT
      field: threads
      filters: []
      group_by: process type
      visualisation: table

  - name: Daily account activity
    custom_definition:
      name: Daily account activity
      target: thread
      operation: COUNT
      field: threads
      filters: []
      group_by: period
      granularity: day
      visualisation: table

  - name: Account completion rate
    template_id: metric_outcome_rate
    parameters:
      status: completed

  - name: Account failure rate
    template_id: metric_outcome_rate
    parameters:
      status: failed

  - name: Average delivery time by process
    template_id: metric_avg_delivery_time
    parameters: {}

  - name: Top failed steps
    template_id: metric_frequent_failure_point
    parameters:
      thread_status: failed
      step_status: failed
      limit: 5

  - name: Step execution outcomes
    custom_definition:
      name: Step execution outcomes
      target: step
      operation: COUNT
      field: steps
      filters: []
      group_by: outcome
      visualisation: table

  - name: Retry hotspots by step
    custom_definition:
      name: Retry hotspots by step
      target: step
      operation: SUM
      field: retries
      filters: []
      group_by: step name
      visualisation: table

  - name: Validation violations by severity
    custom_definition:
      name: Validation violations by severity
      target: thread
      operation: COUNT
      field: violations
      filters: []
      group_by: validation severity
      visualisation: table
